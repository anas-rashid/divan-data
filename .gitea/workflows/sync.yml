name: Wikisource sync
on:
  schedule:
    - cron: "0 3 * * *"  # daily 03:00 UTC
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "divan-bot"
          git config user.email "divan-bot@noreply.git.anasrashid.net"
          ./update.sh
