name: Wikisource sync
on:
  schedule:
    - cron: "0 3 * * *"  # daily 03:00 UTC
  push:  # also run when the sync code changes (bot data commits don't touch these, so no loop)
    paths: [wikisource.py, build_index.py, export_divan.py, update.sh, .gitea/workflows/sync.yml]
  workflow_dispatch:  # "Run workflow" button, Gitea 1.23+
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "divan-bot"
          git config user.email "divan-bot@noreply.git.anasrashid.net"
          ./update.sh
